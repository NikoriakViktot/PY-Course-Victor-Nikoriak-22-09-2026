// Контракт gRPC-сервісу метеоданих (урок 32).
// З цього файлу grpcio-tools генерує Python-класи для сервера і клієнта.
syntax = "proto3";

package meteo;

service Meteo {
  // Одне повідомлення у відповідь — як звичайний виклик функції.
  rpc GetLatest (StationRequest) returns (Observation);
  // Потік повідомлень від сервера — server streaming.
  rpc StreamObservations (StationRequest) returns (stream Observation);
}

message StationRequest {
  string wmo = 1;
}

message Observation {
  string station = 1;
  string time = 2;
  double temperature = 3;
  double pressure = 4;
}
