# PostgreSQL для проєкту нотаток — сторінка «PostgreSQL» кроку 3 Django-книги (notes_db / notes_user / notes_pass).
#   docker compose up -d db
#   export DATABASE_URL=postgres://notes_user:notes_pass@localhost:5432/notes_db   # Windows: set DATABASE_URL=...
#   python manage.py migrate && python manage.py runserver
# Без DATABASE_URL проєкт працює на SQLite, як і раніше. Сам застосунок у контейнері — урок 48 (Docker).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notes_db
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: notes_pass    # лише для навчання на своєму комп'ютері
    ports:
      - "5432:5432"
    volumes:
      - notes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes_user -d notes_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  notes_pgdata:
