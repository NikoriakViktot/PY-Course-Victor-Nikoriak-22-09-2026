# CI/CD для news_hub — урок 50 курсу (module_5/lessons/lesson_50_ci_cd/news_hub).
# Основа — .github/workflows/django-tests.yml Django-книги notes_chat_app: services PostgreSQL, кеш pip, paths.
# Що змінено і чому — docs/modules/m5/lesson_50.md.
#
#   PR (у будь-яку гілку) → тести ×2 версії Python, мінімальні версії, PostgreSQL + Redis, mypy, образ + smoke
#   push у main          → те саме + публікація образу в GitHub Container Registry (ghcr.io)

name: news_hub — CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'module_5/lessons/lesson_50_ci_cd/news_hub/**'
      - '.github/workflows/news_hub.yml'
  pull_request:                      # без branches: PR у будь-яку гілку (зокрема PR поверх іншого PR)
    paths:
      - 'module_5/lessons/lesson_50_ci_cd/news_hub/**'
      - '.github/workflows/news_hub.yml'
  workflow_dispatch:

permissions:
  contents: read                     # найменше потрібне; публікації образу — окремий дозвіл нижче

concurrency:                         # новий push у той самий PR скасовує попередній прогін
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: module_5/lessons/lesson_50_ci_cd/news_hub

defaults:
  run:
    working-directory: module_5/lessons/lesson_50_ci_cd/news_hub

jobs:
  tests:
    name: pytest · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false               # впала 3.10 — все одно дізнатися, що з 3.13
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ env.PROJECT }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -m unit -q        # швидкі — першими: падають за секунди
      - run: pytest -q                # усі: SQLite у пам'яті + fakeredis + двійник Telegram + FakeLLM

  min-versions:
    name: pytest · мінімальні версії (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # lowest-direct: кожна залежність з requirements.txt — найменша дозволена версія (>=…).
      # Так перевіряється, що нижні межі в requirements.txt правдиві, а не лише «зараз працює з найновішими».
      - run: uv venv --python 3.10 .venv
      - run: uv pip install --resolution lowest-direct -r requirements-dev.txt
      - run: .venv/bin/pytest -q

  postgres:
    name: pytest і Alembic · PostgreSQL 16 + Redis 7
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: news_hub_test
          POSTGRES_USER: news
          POSTGRES_PASSWORD: news         # одноразова база CI, живе хвилини; не секрет
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://news:news@localhost:5432/news_hub_test
      TEST_REDIS_URL: redis://localhost:6379/15
      DATABASE_URL: postgresql+asyncpg://news:news@localhost:5432/news_hub_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ env.PROJECT }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: міграції на чистій базі й перевірка, що моделі збігаються з міграціями
        run: |
          alembic upgrade head
          alembic check
      - run: pytest -q

  types:
    name: mypy --strict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ env.PROJECT }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: mypy --strict news_hub

  docker:
    name: образ і smoke-тест Compose
    needs: tests                     # образ збираємо, лише коли код пройшов тести
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ env.PROJECT }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: тести образу (урок 48)
        run: pytest -m docker -q
      - name: .env для smoke — випадкові секрети, пароль адміна замасковано в журналі
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          ADMIN_PASSWORD="$password" HTTP_PORT=8080 python scripts/make_env.py
      - name: smoke — увесь стек через nginx (урок 49)
        run: ./scripts/smoke.sh

  publish:
    name: публікація образу в ghcr.io
    needs: [tests, min-versions, postgres, types, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write                # лише цьому job і лише на push у main
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # тимчасовий токен прогону, не особистий
      - id: meta
        uses: docker/metadata-action@v5            # імена образів — у нижньому регістрі (вимога реєстру)
        with:
          images: ghcr.io/${{ github.repository_owner }}/news_hub
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
