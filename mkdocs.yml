site_name: PY Course — Viktor Nikoriak
site_description: Курс Python українською — від основ до просунутих тем, у форматі книги
site_url: https://nikoriakviktot.github.io/PY-Course-Victor-Nikoriak-22-09-2026/
repo_url: https://github.com/NikoriakViktot/PY-Course-Victor-Nikoriak-22-09-2026
repo_name: NikoriakViktot/PY-Course-Victor-Nikoriak-22-09-2026
docs_dir: docs
site_dir: site

theme:
  name: material
  language: uk
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.prune
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: uk

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore

nav:
  - Головна: index.md

  - Як користуватися:
    - Вступ: 00_getting_started/README.md
    - Встановлення Git: 00_getting_started/git_setup.md
    - Налаштування середовища: 00_getting_started/environment_setup.md
    - Ноутбуки в Google Colab: 00_getting_started/colab.md
    - Jupyter локально: 00_getting_started/jupyter.md
    - PyCharm: 00_getting_started/pycharm.md
    - VS Code: 00_getting_started/vscode.md
    - Здача домашніх робіт: 00_getting_started/homework_workflow.md
    - Часті проблеми: 00_getting_started/troubleshooting.md
    - GitHub:
      - Огляд: 00_getting_started/github/README.md
      - SSH-ключі: 00_getting_started/github/ssh_keys.md
      - Fork і Clone: 00_getting_started/github/fork_and_clone.md
      - Pull Request: 00_getting_started/github/pull_request.md
      - Як створити свій репозиторій: 00_getting_started/github/create_repository.md

  - Модулі курсу (в розробці):
    - Огляд: modules/README.md
    - "М1. Основи Python":
      - Огляд модуля: modules/m1/index.md
      - "1. Вступ: формат курсу, AI-політика": modules/m1/lesson_01.md
      - "2. Перші кроки": modules/m1/lesson_02.md
      - "3. Змінні та базові типи даних": modules/m1/lesson_03.md
      - "4. Умови та цикли": modules/m1/lesson_04.md
      - "5. Списки, кортежі, множини": modules/m1/lesson_05.md
      - "6. Словники, for, comprehensions": modules/m1/lesson_06.md
      - "7. Функції": modules/m1/lesson_07.md
      - "8. П1. Big O + базові задачі": modules/m1/lesson_08.md
      - "9. Декоратори": modules/m1/lesson_09.md
      - "10. Ітератори й генератори": modules/m1/lesson_10.md
      - "11. П2. Пошук": modules/m1/lesson_11.md
      - "12. Модулі та стандартна бібліотека": modules/m1/lesson_12.md
      - "13. Винятки та обробка помилок": modules/m1/lesson_13.md
      - "14. Файли I/O, JSON": modules/m1/lesson_14.md
      - "15. Git & GitHub: система": modules/m1/lesson_15.md
      - "16. П3. Хеш-структури": modules/m1/lesson_16.md
      - "17. Узагальнення + фінальний проєкт": modules/m1/lesson_17.md
    - "М2. Python Advanced":
      - Огляд модуля: modules/m2_python_advanced.md
      - "18. Функції як об'єкти першого класу": modules/m2/lesson_18.md
      - "19. Класи, простір імен": modules/m2/lesson_19.md
      - "20. Наслідування, поліморфізм": modules/m2/lesson_20.md
      - "21. Інкапсуляція, область видимості": modules/m2/lesson_21.md
      - "22. П4. Рекурсія, divide & conquer, backtracking": modules/m2/lesson_22.md
      - "23. @property, декоратори класів, dunder": modules/m2/lesson_23.md
      - "24. Ітератори advanced": modules/m2/lesson_24.md
      - "25. Тестування з pytest (+ валідація AI-коду)": modules/m2/lesson_25.md
    - "М3. Бази даних": modules/m3_databases.md
    - "М4. Web (+ Web Advanced)": modules/m4_web.md
    - "М5. Production": modules/m5_production.md
    - "М6. Капстоун": modules/m6_capstone.md
    - "Self-paced. AI для розробників (бонус)": modules/bonus_ai.md

  - Довідник:
    - Ментальна модель Python: 00_python_mental_model.md
    - Zen of Python: 01_zen_of_python.md
    - Git шпаргалка: git-cheatsheet.md
    - "Python Core":
      - Огляд: reference/python_core/index.md
      - "Списки (list)": reference/python_core/lists.md
      - "Кортежі (tuple, namedtuple)": reference/python_core/tuples.md
      - "Множини (set)": reference/python_core/sets.md
      - "Словники (dict)": reference/python_core/dicts.md
      - "Рядки (str)": reference/python_core/strings.md
      - "Функції та ФП": reference/python_core/functions.md
      - "Простори імен / LEGB": reference/python_core/namespaces_legb.md
      - "eval() та безпечні альтернативи": reference/python_core/eval_and_safe_alternatives.md
      - "Exceptions & Error Handling": reference/python_core/exceptions.md
      - "File I/O та JSON": reference/python_core/file_io_json.md
      - "Python Helper Toolkit": reference/python_core/introspection_debug_tools.md
