# Проєкт нотаток повністю: nginx → daphne (HTTP + WebSocket чату) → PostgreSQL + Redis. Урок 49.
# Основа — docker-compose.yml Django-книги notes_chat_app (db, redis, web, nginx).
#
#   cp .env.example .env            # і заповнити
#   docker compose up -d --build --wait
#   docker compose exec web python manage.py createsuperuser
#
# Порядок: db, redis (healthy) → release (міграції + статика, один раз) → web (healthy) → nginx.
# Масштабування: docker compose up -d --scale web=2 — міграції не запускаються двічі (release окремо),
# чат працює між процесами через Redis channel layer (урок 45).
name: crispy_notes

x-app: &app
  build: .
  image: crispy_notes:49
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgres://${POSTGRES_USER:-notes_user}:${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD у .env}@db:5432/${POSTGRES_DB:-notes_db}
    REDIS_URL: redis://redis:6379/0

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notes_db}
      POSTGRES_USER: ${POSTGRES_USER:-notes_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD у .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Крок випуску — один раз на запуск, а не в кожному контейнері web (entrypoint книги):
  # дві репліки web з migrate при старті одночасно створюють ті самі таблиці й падають.
  release:
    <<: *app
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput --clear"]
    volumes:
      - staticfiles:/app/staticfiles
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    depends_on:
      release:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  staticfiles:
