# nginx перед проєктом нотаток. Урок 49. Основа — nginx/nginx.conf Django-книги (notes_chat_app).
# Статика — з тому, куди collectstatic поклав файли; решта (HTTP і WebSocket чату) — у daphne.

# Upgrade → Connection: для WebSocket «upgrade», для звичайних запитів — «close»
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 5m;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location /static/ {
        alias /staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://django;
        # $http_host — з портом (localhost:8080). $host порт відкидає, і Django відхиляє форми:
        # «Origin checking failed - http://localhost:8080 does not match any trusted origins».
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $remote_addr;      # перезаписати, не дописувати (урок 49, news_hub)
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket чату (урок 45)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
