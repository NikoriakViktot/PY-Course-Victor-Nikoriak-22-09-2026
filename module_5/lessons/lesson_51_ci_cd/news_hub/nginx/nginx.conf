# nginx перед news_hub. Урок 49. Основа — nginx/default.conf зі стартового production_bot.
# TLS тут немає: на сервері його знімає окремий крок (certbot чи Caddy, сторінка уроку 49) або цей файл
# доповнюють блоком `listen 443 ssl`. Сам news_hub (api:8000) назовні не відкритий — лише через nginx.

upstream news_hub_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;          # API приймає JSON, не файли

    # Перевірка самого nginx (healthcheck Compose): не залежить від API
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://news_hub_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        # Реальний IP клієнта — ПЕРЕЗАПИСУЄМО, а не дописуємо ($proxy_add_x_forwarded_for):
        # інакше клієнт сам надішле «X-Forwarded-For: будь-що» і обійде rate limit входу (урок 46).
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;           # webhook Telegram чекає відповідь до 60 с
    }
}
