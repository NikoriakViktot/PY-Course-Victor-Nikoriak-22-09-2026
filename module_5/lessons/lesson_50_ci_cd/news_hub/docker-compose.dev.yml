# Розробка на своєму комп'ютері (урок 49): база й Redis з docker-compose.yml, а застосунок — uvicorn --reload.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis
#   export DATABASE_URL=postgresql+asyncpg://news:<POSTGRES_PASSWORD з .env>@localhost:5432/news_hub
#   export REDIS_URL=redis://localhost:6379/0
#   alembic upgrade head && uvicorn news_hub.api:app --reload
# Порти відкриті лише на 127.0.0.1 — з мережі до бази не дістатись. На сервері цей файл не використовують.
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  redis:
    ports:
      - "127.0.0.1:6379:6379"
